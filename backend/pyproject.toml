[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "outfield-analytics-backend"
version = "0.1.0"
description = "Backend API for Outfield Analytics"
requires-python = ">=3.13"
dependencies = [
  "alembic==1.20.0",
  "fastapi==0.141.1",
  "psycopg[binary]==3.3.6",
  "pydantic-settings==2.15.0",
  "sqlalchemy==2.0.54",
  "uvicorn==0.52.4",
]

[project.optional-dependencies]
test = [
  "httpx2==2.12.0",
  "pytest==9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
